name: astrbot_plugin_mine_chat # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: 萌萌日程 # 用于展示的名字
desc: 让 Bot 拥有自己的生活日程（贴合人设与世界观），并据此在合适的时机主动来找你说话。同一人格的私聊与群聊窗口共享同一份生活。 # 插件简短描述
short_desc: 日程排布 × 主动消息，角色有自己的生活才会主动得更自然。 # 插件市场卡片短描述
version: v1.0.4 # 插件版本号（唯一来源，其他位置一律由它派生）

author: windExplorer # 作者（须与插件市场源的 author 一致，即 GitHub 用户名）
author_url: https://github.com/windExplorer # 作者主页
repo: https://github.com/windExplorer/astrbot_plugin_mine_chat # 插件的仓库地址
category: entertainment # 插件市场分类（英文 key 枚举）
tags: # 插件市场标签
  - 日程
  - 主动消息
  - 陪伴
  - 人格
astrbot_version: ">=4.24.0" # 要求的 AstrBot 版本范围

# 插件 WebUI 页面：AstrBot 会自动把 pages/<name>/index.html 挂载为插件页，
# 后端 API 通过 context.register_web_api 注册（见 webui_api.py）。
pages:
  - name: schedule-console
    title: 萌萌日程
